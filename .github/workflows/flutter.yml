name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform when missing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name comptaflow .
            echo "ANDROID_CREATED=true" >> "$GITHUB_ENV"
          else
            echo "ANDROID_CREATED=false" >> "$GITHUB_ENV"
          fi

      - name: Persist Android platform in main
        if: env.ANDROID_CREATED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          if git diff --cached --quiet; then
            echo "No Android platform changes to commit."
          else
            git commit -m "build(android): commit generated Android platform [skip ci]"
            git push origin HEAD:main
          fi

      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart

      - name: Enable Android core library desugaring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('android/app/build.gradle.kts')
          if not path.exists():
              path = Path('android/app/build.gradle')

          if not path.exists():
              raise SystemExit('No Android app Gradle file found')

          text = path.read_text()

          if path.suffix == '.kts':
              if 'isCoreLibraryDesugaringEnabled = true' not in text:
                  marker = 'android {\n'
                  if marker not in text:
                      raise SystemExit('android { block not found')
                  text = text.replace(
                      marker,
                      marker + '    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }\n\n',
                      1,
                  )

              dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")'
              if dependency not in text:
                  text += '\n\ndependencies {\n    ' + dependency + '\n}\n'
          else:
              if 'coreLibraryDesugaringEnabled true' not in text:
                  marker = 'android {\n'
                  if marker not in text:
                      raise SystemExit('android { block not found')
                  text = text.replace(
                      marker,
                      marker + '    compileOptions {\n        coreLibraryDesugaringEnabled true\n    }\n\n',
                      1,
                  )

              dependency = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'"
              if dependency not in text:
                  text += '\n\ndependencies {\n    ' + dependency + '\n}\n'

          path.write_text(text)
          print(f'Configured {path}')
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: |
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test
          else
            echo 'No Flutter test files found; skipping flutter test.'
          fi

      - name: Build debug APK
        run: >-
          flutter build apk --debug
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: comptaflow-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
