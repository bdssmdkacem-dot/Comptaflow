name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform
        run: flutter create --platforms=android --project-name comptaflow .

      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart

      - name: Enable Android core library desugaring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gradle_kts = Path('android/app/build.gradle.kts')
          gradle_groovy = Path('android/app/build.gradle')

          if gradle_kts.exists():
              path = gradle_kts
              text = path.read_text()

              if 'isCoreLibraryDesugaringEnabled = true' not in text:
                  marker = 'android {\n'
                  if marker not in text:
                      raise SystemExit('android { block not found in build.gradle.kts')
                  text = text.replace(
                      marker,
                      marker + '    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }\n\n',
                      1,
                  )

              if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:' not in text:
                  marker = 'dependencies {\n'
                  if marker not in text:
                      raise SystemExit('dependencies { block not found in build.gradle.kts')
                  text = text.replace(
                      marker,
                      marker + '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n',
                      1,
                  )

              path.write_text(text)
              print('Configured android/app/build.gradle.kts')

          elif gradle_groovy.exists():
              path = gradle_groovy
              text = path.read_text()

              if 'coreLibraryDesugaringEnabled true' not in text:
                  marker = 'android {\n'
                  if marker not in text:
                      raise SystemExit('android { block not found in build.gradle')
                  text = text.replace(
                      marker,
                      marker + '    compileOptions {\n        coreLibraryDesugaringEnabled true\n    }\n\n',
                      1,
                  )

              if "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:" not in text:
                  marker = 'dependencies {\n'
                  if marker not in text:
                      raise SystemExit('dependencies { block not found in build.gradle')
                  text = text.replace(
                      marker,
                      marker + "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'\n",
                      1,
                  )

              path.write_text(text)
              print('Configured android/app/build.gradle')

          else:
              raise SystemExit('No Android app Gradle file found')
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: |
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test
          else
            echo 'No Flutter test files found; skipping flutter test.'
          fi

      - name: Build debug APK
        run: >-
          flutter build apk --debug
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: comptaflow-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
